<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamics Wasted Time Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>⏱️ Wasted Time Tracker</h1>

    <div id="usernameBanner" class="username-banner" style="display:none;">
      <span class="banner-text">⚠️ No display name set — go to <a id="bannerSettingsLink" href="#">Settings</a> to join the leaderboard.</span>
      <button id="bannerDismiss" class="banner-dismiss">✕</button>
    </div>

    <div class="stats">
      <div class="stat-box">
        <h2>Wasted Time Today</h2>
        <p class="time" id="todayTime">00:00:00</p>
      </div>

      <div class="stat-box">
        <h2>Wasted Time Total</h2>
        <p class="time" id="totalTime">00:00:00</p>
      </div>
    </div>

    <div class="status" id="status">
      <p>Status: <span id="statusText">Not on Dynamics.com</span></p>
      <p id="loadingIndicator" style="display: none; color: #ff6b6b;">⚠️ Loading indicator visible</p>
    </div>

    <div class="chart-section">
      <div class="chart-header">
        <h2>Daily Stats</h2>
        <select id="timespanSelect" class="timespan-select">
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30">Last 30 days</option>
          <option value="365">Last year</option>
          <option value="all">All time</option>
        </select>
      </div>
      <div class="chart-wrap">
        <canvas id="statsChart"></canvas>
        <div id="chartTooltip" class="chart-tooltip"></div>
      </div>
    </div>

    <div id="leaderboardSection" class="leaderboard-section">
      <div class="leaderboard-header">
        <h2>Leaderboard</h2>
        <button id="refreshLeaderboard" class="btn-icon" title="Refresh">↻</button>
      </div>
      <div id="leaderboardContent"><p class="lb-info">Loading...</p></div>
    </div>

    <div class="buttons">
      <button id="resetTodayBtn" class="btn btn-secondary">Reset Today</button>
      <button id="settingsBtn" class="btn btn-primary">⚙️ Settings</button>
    </div>

    <div class="coffee-link">
      <a href="https://buymeacoffee.com/nyyks" target="_blank">Buy me a Coffee ☕</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
